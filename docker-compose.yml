services:
    # ----------------------------
    # Nginx - servidor web
    # ----------------------------
    nginx:
        image: nginx:alpine
        container_name: laravel_nginx
        ports:
            - "80:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - laravel_network

    # ----------------------------
    # PHP-FPM - aplicação Laravel
    # ----------------------------
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        #nome da aplicação, mude a cada projeto
        container_name: laravel_app
        volumes:
            - .:/var/www/html
        depends_on:
            - mysql
            - redis
        networks:
            - laravel_network

    # ----------------------------
    # MySQL - banco de dados
    # ----------------------------
    mysql:
        image: mysql:8.0
        container_name: laravel_mysql
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        ports:
            - "3308:3306" # 3307 na sua máquina, 3306 dentro do Docker
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - laravel_network

    # ----------------------------
    # Redis - filas e cache
    # ----------------------------
    redis:
        image: redis:alpine
        container_name: laravel_redis
        ports:
            - "6379:6379"
        networks:
            - laravel_network

    # ----------------------------
    # Queue Worker - filas (jobs)
    # ----------------------------
    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: laravel_queue
        command: php artisan queue:work --sleep=3 --tries=3
        volumes:
            - .:/var/www/html
        depends_on:
            - mysql
            - redis
        networks:
            - laravel_network

    # ----------------------------
    # Reverb - WebSocket
    # ----------------------------
    reverb:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: laravel_reverb
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        ports:
            - "8080:8080"
        volumes:
            - .:/var/www/html
        depends_on:
            - redis
        networks:
            - laravel_network

    mailpit:
        image: axllent/mailpit
        restart: unless-stopped
        ports:
            - "8026:8025" # interface web
            - "1025:1025" # SMTP
        networks:
            - laravel_network
    # ----------------------------
    # Node - build de assets (Vite) - opcional pode só mandar o build
    # ----------------------------
    # node:
    #   image: node:24-alpine
    #   container_name: laravel_node
    #   working_dir: /var/www/html
    #   volumes:
    #     - .:/var/www/html
    #   command: sh -c "npm run dev -- --host 0.0.0.0 --port 5173"
    #   ports:
    #     - "5173:5173"
    #   networks:
    #     - laravel_network

# ----------------------------
# Volumes persistentes
# ----------------------------
volumes:
    mysql_data:

# ----------------------------
# Rede interna
# ----------------------------
networks:
    laravel_network:
        driver: bridge
